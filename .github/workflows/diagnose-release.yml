name: Diagnose published APK

on:
  push:
    branches: ["arena/**"]
    paths:
      - '.github/workflows/diagnose-release.yml'
      - '.github/scripts/diagnose-release-install.sh'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Download published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir apk
          gh release download v1.0.0 -R "$GITHUB_REPOSITORY" -D apk -p '*_universal.apk' -p '*_arm64-v8a.apk' -p '*_armeabi-v7a.apk'
      - name: Check downloaded APK archives
        run: for apk in apk/*.apk; do unzip -tq "$apk"; done
      - name: Check APK signatures
        run: |
          sdkmanager 'build-tools;35.0.0'
          for apk in apk/*.apk; do "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"; done
      - name: Install universal APK on Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/diagnose-release-install.sh
      - name: Result - success
        if: env.INSTALL_RESULT == 'SUCCESS'
        run: echo 'Universal APK installed successfully on the emulator.'
      - name: Result - invalid APK
        if: env.INSTALL_RESULT == 'INSTALL_FAILED_INVALID_APK' || env.INSTALL_RESULT == 'INSTALL_PARSE_FAILED_NOT_APK' || env.INSTALL_RESULT == 'INSTALL_PARSE_FAILED_NO_CERTIFICATES' || env.INSTALL_RESULT == 'INSTALL_PARSE_FAILED_INCONSISTENT_CERTIFICATES'
        run: exit 1
      - name: Result - native library failure
        if: env.INSTALL_RESULT == 'INSTALL_FAILED_NO_MATCHING_ABIS' || env.INSTALL_RESULT == 'INSTALL_FAILED_INVALID_APK_NATIVE_LIBRARIES'
        run: exit 1
      - name: Result - other install failure
        if: env.INSTALL_RESULT != 'SUCCESS' && env.INSTALL_RESULT != ''
        run: echo "Installer result $INSTALL_RESULT"; exit 1
