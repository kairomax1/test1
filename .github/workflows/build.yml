name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make my own signing key
        run: |
          keytool -genkeypair -v -keystore keystore.jks -alias myalias -keyalg RSA -keysize 2048 -validity 10950 -storepass 123456 -keypass 123456 -dname "CN=Test1 App, OU=Personal, O=Personal, L=Tehran, ST=Tehran, C=IR"
          echo "ENCODED_KEYSTORE=$(base64 -w0 keystore.jks)" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          encodedString: ${{ env.ENCODED_KEYSTORE }}
          storePassword: 123456
          keyAlias: myalias
          keyPassword: 123456
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Build debug APK (fallback)
        if: failure()
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: test1-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload debug APK
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test1-debug-apk
          path: app/build/outputs/apk/debug/*.apk
